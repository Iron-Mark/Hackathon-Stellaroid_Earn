name: Contract CI

on:
  push:
    branches:
      - main
      - staging
      - "*-monthly-builder"
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/contract-ci.yml"
  pull_request:
    branches:
      - main
      - staging
      - "*-monthly-builder"
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Test and build Soroban contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        # Pinned to a commit SHA rather than the mutable `stable` branch ref so a
        # compromised upstream push cannot silently change what runs here. This
        # freezes the action's code, not the compiler: rustup still resolves the
        # `stable` toolchain at run time. Dependabot's actions-all group keeps the
        # pin current. `toolchain` is declared explicitly because the master
        # lineage marks it required with no default.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head, 2026-07-16
        with:
          toolchain: stable
          targets: wasm32v1-none

      # Registry and git only. Caching `target/` made one Linux key ~740 MB and
      # GitHub stores a copy per ref, which is how Contract CI reached multiple
      # gigabytes. The weekly Windows verifier already caches crates this way
      # (~21 MB). Rebuilding this small WASM is cheaper than storing `target/`.
      # New key prefix so runners do not restore the bloated `contract-cargo-*` entries.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: contract-crates-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'contracts/stellaroid_earn/Cargo.toml') }}
          restore-keys: |
            contract-crates-${{ runner.os }}-

      - name: Run contract tests
        run: cargo test -p stellaroid_earn --locked

      - name: Build contract WASM
        run: cargo build -p stellaroid_earn --target wasm32v1-none --release --locked
