name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release-stellaroid-earn:
    permissions:
      id-token: write
      contents: write
      attestations: write
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Stellaroid Earn — on-chain credential registry for Stellar PH Bootcamp'
      relative_path: 'contracts/stellaroid_earn'
      package: 'stellaroid_earn'
      home_domain: 'stellaroid.tech'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
