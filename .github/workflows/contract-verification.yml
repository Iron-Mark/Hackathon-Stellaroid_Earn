name: Contract Source Verification

# Proves that the deployed testnet contract is byte-for-byte reproducible from
# committed source. The deployed bytecode corresponds to a RELEASE TAG, not to
# the moving default branch, so this rebuilds the tag that was actually
# deployed and asserts the SHA-256 matches both the recorded hash and the
# bytecode currently live on testnet.
#
# Reproducibility is toolchain-sensitive: the Rust and Stellar CLI versions
# below are the ones the deployment was built with. Changing either can change
# the output hash even when the source is identical, so they are pinned.

on:
  push:
    branches:
      - main
      - staging
    paths:
      - ".github/workflows/contract-verification.yml"
      - "scripts/verify-contract-source.ps1"
      - "docs/operations/contract-verification.md"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - ".github/workflows/contract-verification.yml"
      - "scripts/verify-contract-source.ps1"
      - "docs/operations/contract-verification.md"
  schedule:
    # Weekly, so a contract that is replaced or archived on testnet surfaces
    # here rather than in a reviewer's terminal.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The release tag whose source produced the deployed bytecode.
  DEPLOYED_TAG: v3.0.0
  # Manifest path as it existed AT THAT TAG. The contract has since moved to
  # contracts/stellaroid_earn/, so this is deliberately not the current layout.
  CONTRACT_MANIFEST: ./contract/Cargo.toml
  # SHA-256 of the deployed WASM, recorded at deploy time (2026-07-09).
  EXPECTED_HASH: 1b7479f1ca0f12846bbfdd8f0681670692e29e1f20618150912f010b7caf4b9f
  CONTRACT_ID: CAD6C24POQGRYXMBNBEGVDHUROF5ZC37XRDC6NCVILTXWMYJIBMISZCV
  RPC_URL: https://soroban-testnet.stellar.org
  NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  # Pinned to the toolchain the deployment was built with.
  RUST_VERSION: 1.95.0
  STELLAR_CLI_VERSION: 27.0.0

jobs:
  verify:
    name: Rebuild ${{ github.event.repository.name }} contract from its release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the deployed release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYED_TAG }}

      - name: Setup Rust
        # Pinned to a commit SHA rather than the mutable `stable` branch ref, and
        # to an exact toolchain version, because a compiler change can alter the
        # emitted WASM even when the source does not change.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head, 2026-07-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Install Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo install -m 0755 /tmp/stellar "$(dirname "$(command -v cargo)")/stellar" 2>/dev/null \
            || sudo install -m 0755 /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Rebuild the contract from source
        # --locked so the committed Cargo.lock governs transitive versions; a
        # silent dependency bump is exactly what breaks reproducibility.
        run: |
          set -euo pipefail
          mkdir -p /tmp/rebuild
          stellar contract build \
            --manifest-path "$CONTRACT_MANIFEST" \
            --locked \
            --meta source_repo=github:Iron-Mark/Hackathon-Stellaroid_Earn \
            --meta home_domain=stellaroid.tech \
            --out-dir /tmp/rebuild
          ls -la /tmp/rebuild

      - name: Assert the rebuild matches the recorded hash
        run: |
          set -euo pipefail
          actual="$(sha256sum /tmp/rebuild/stellaroid_earn.wasm | cut -d' ' -f1)"
          echo "expected: ${EXPECTED_HASH}"
          echo "rebuilt:  ${actual}"
          if [ "$actual" != "$EXPECTED_HASH" ]; then
            echo "::error::Rebuild from ${DEPLOYED_TAG} does not reproduce the recorded deployed hash."
            exit 1
          fi
          echo "Rebuild reproduces the recorded deployed hash."

      - name: Fetch the live testnet bytecode and compare
        run: |
          set -euo pipefail
          stellar contract fetch \
            --id "$CONTRACT_ID" \
            --rpc-url "$RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" \
            --out-file /tmp/deployed.wasm
          onchain="$(sha256sum /tmp/deployed.wasm | cut -d' ' -f1)"
          rebuilt="$(sha256sum /tmp/rebuild/stellaroid_earn.wasm | cut -d' ' -f1)"
          echo "on-chain: ${onchain}"
          echo "rebuilt:  ${rebuilt}"
          if [ "$onchain" != "$rebuilt" ]; then
            echo "::error::Bytecode live on testnet does not match the rebuild from ${DEPLOYED_TAG}."
            exit 1
          fi
          echo "Live testnet bytecode matches the rebuild."

      - name: Show embedded source metadata
        run: stellar contract info meta --wasm /tmp/deployed.wasm

      - name: Summary
        run: |
          {
            echo "### Contract source verification"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release tag | \`${DEPLOYED_TAG}\` |"
            echo "| Contract | \`${CONTRACT_ID}\` |"
            echo "| SHA-256 | \`${EXPECTED_HASH}\` |"
            echo "| Rust | \`${RUST_VERSION}\` |"
            echo "| Stellar CLI | \`${STELLAR_CLI_VERSION}\` |"
            echo ""
            echo "Rebuild from the release tag reproduces the recorded hash, and the"
            echo "bytecode live on Stellar testnet matches that rebuild."
          } >> "$GITHUB_STEP_SUMMARY"
