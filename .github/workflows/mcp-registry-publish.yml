# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) under io.github.Iron-Mark/* via GitHub
# Actions OIDC — no stored secrets. Trigger manually (workflow_dispatch) or by
# pushing an mcp-v* tag (the app's own v* release tags deliberately do NOT
# trigger this).
#
# Registry versions are immutable: bump `version` in server.json before
# re-publishing.
name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["mcp-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for registry auth
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.12
          MCP_PUBLISHER_SHA256: ed3446e4caf067764cc13d35208b73ed68869958e32bc3842d0a863102912dcb
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Verify listing
        run: |
          sleep 5
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.Iron-Mark/stellaroid-earn" | tee listing.json
          grep -q '"io.github.Iron-Mark/stellaroid-earn"' listing.json
