<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <title>Offline — Stellaroid Earn</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      padding-left: calc(24px + env(safe-area-inset-left));
      padding-right: calc(24px + env(safe-area-inset-right));
      text-align: center;
    }
    main { max-width: 26rem; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 1.375rem; letter-spacing: -0.01em; }
    p { color: #94A3B8; font-size: 0.9375rem; line-height: 1.6; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 8px;
      padding: 0 24px;
      border-radius: 9999px;
      background: #F59E0B;
      color: #0F172A;
      font-weight: 600;
      font-size: 0.9375rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="" />
    <h1>You&rsquo;re offline</h1>
    <p>
      Stellaroid Earn needs a connection to reach the Stellar network.
      Your proofs are safe on-chain &mdash; reconnect and try again.
    </p>
    <!-- Empty href resolves to the URL the user was opening, so retry
         re-attempts the interrupted navigation rather than going home. -->
    <a href="">Try again</a>
  </main>
</body>
</html>
